<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pexideal | Sign In to Your Account</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #4f46e5;
      --secondary-color: #06b6d4;
    }

    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      color: #334155;
      min-height: 100vh;
    }

    .auth-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.15);
    }

    .btn-toggle-password {
      border-left: none;
      background: transparent;
    }
  </style>
</head>
<body class="d-flex flex-column justify-content-between">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary fs-4" href="index.html">
        <i class="bi bi-card-heading me-1"></i> Pexideal
      </a>
      <span class="navbar-text text-muted small">
        New here? <a href="client-signup.html" class="text-primary text-decoration-none fw-semibold">Create an Account</a>
      </span>
    </div>
  </nav>

  <!-- SIGN IN MAIN CONTAINER -->
  <main class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        
        <div class="card auth-card p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 mb-3">
              <i class="bi bi-person-lock fs-2"></i>
            </div>
            <h3 class="fw-bold mb-1">Welcome Back</h3>
            <p class="text-muted small">Sign in to access your digital discount card and perks.</p>
          </div>

          <!-- Alert Container for Login Errors -->
          <div id="error-alert" class="alert alert-danger d-none py-2 px-3 small rounded-3 mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span id="error-message">Invalid email or password.</span>
          </div>

          <form id="signin-form" class="needs-validation" novalidate>
            <!-- Email Input -->
            <div class="mb-3">
              <label for="signin-email" class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-start-0" id="signin-email" placeholder="alex@example.com" required>
              </div>
            </div>

            <!-- Password Input with Toggle -->
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="signin-password" class="form-label small fw-semibold mb-0">Password</label>
                <a href="#" class="text-primary text-decoration-none fs-7 fw-semibold">Forgot?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control border-start-0 border-end-0" id="signin-password" placeholder="Enter password" required>
                <button class="btn btn-outline-secondary border-start-0 btn-toggle-password" type="button" id="btn-toggle-pwd">
                  <i class="bi bi-eye-slash text-muted" id="toggle-icon"></i>
                </button>
              </div>
            </div>

            <!-- Remember Me Checkbox -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="remember-me" checked>
              <label class="form-check-label small text-muted" for="remember-me">
                Keep me signed in on this device
              </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold w-100" id="btn-signin">
              <span id="btn-text">Sign In <i class="bi bi-arrow-right ms-1"></i></span>
              <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </form>

        </div>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center text-muted small py-3">
    &copy; 2026 Pexideal. All rights reserved.
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
