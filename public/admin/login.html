<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pexideal Admin | System Access</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Shared Custom Stylesheets -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">

  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .admin-card {
      background-color: #111827;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .form-control {
      background-color: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
    }

    .form-control:focus {
      background-color: #0b0f19;
      border-color: #ef4444;
      color: #ffffff;
      box-shadow: 0 0 0 0.25rem rgba(239, 68, 68, 0.2);
    }

    .form-control::placeholder {
      color: #64748b;
    }

    .input-group-text {
      background-color: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #64748b;
      border-radius: 0.75rem;
    }

    .btn-admin-custom {
      background: linear-gradient(135deg, #dc2626 0%, #7c3aed 100%);
      border: none;
      color: #ffffff;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 50rem;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .btn-admin-custom:hover {
      opacity: 0.95;
      color: #ffffff;
    }

    .btn-admin-custom:active {
      transform: scale(0.98);
    }

    .badge-admin {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body class="p-3 p-md-4">

  <!-- TOP BRAND HEADER -->
  <header class="text-center my-3">
    <a href="../index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
      <img src="../assets/images/logo.svg" alt="Pexideal Logo" height="36" onerror="this.onerror=null; this.src='../assets/images/placeholder-store.svg';">
      <span class="fs-4 fw-bold text-white">Pexideal <span class="fw-normal text-danger">Console</span></span>
    </a>
  </header>

  <!-- LOGIN CARD CONTAINER -->
  <main class="container my-auto" style="max-width: 440px;">
    <div class="card admin-card p-4 p-sm-5">
      
      <div class="text-center mb-4">
        <span class="badge badge-admin px-3 py-2 rounded-pill fw-semibold mb-2">
          <i class="bi bi-shield-lock-fill me-1"></i> Restricted Access
        </span>
        <h3 class="fw-bold text-white mb-1">Admin Console</h3>
        <p class="text-white-50 small">System configuration & partner management</p>
      </div>

      <!-- Alert Notification Area -->
      <div id="auth-alert" class="alert d-none rounded-3 py-2 px-3 small mb-3" role="alert"></div>

      <!-- Sign In Form -->
      <form id="admin-login-form" novalidate>
        
        <!-- Admin Username / Email Field -->
        <div class="mb-3">
          <label for="login-identifier" class="form-label text-white-50 small fw-semibold">Admin Identifier</label>
          <div class="input-group">
            <span class="input-group-text border-end-0"><i class="bi bi-person-badge"></i></span>
            <input type="email" id="login-identifier" class="form-control border-start-0" placeholder="admin@pexideal.com" required>
          </div>
        </div>

        <!-- Security Key / Password Field -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="login-password" class="form-label text-white-50 small fw-semibold mb-0">Security Passcode</label>
          </div>
          <div class="input-group">
            <span class="input-group-text border-end-0"><i class="bi bi-key"></i></span>
            <input type="password" id="login-password" class="form-control border-start-0 border-end-0" placeholder="••••••••••••" required>
            <button class="btn btn-outline-secondary border-start-0 text-white-50 input-group-text" type="button" id="btn-toggle-password">
              <i class="bi bi-eye" id="toggle-icon"></i>
            </button>
          </div>
        </div>

        <!-- Security Checkbox -->
        <div class="form-check mb-4">
          <input class="form-check-input bg-dark border-secondary" type="checkbox" id="require-2fa" checked disabled>
          <label class="form-check-label text-white-50 small" for="require-2fa">
            Enforce active session logging
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-admin-custom w-100 mb-3" id="btn-submit">
          <span>Authenticate Session</span>
        </button>

      </form>

      <!-- Security Notice -->
      <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
        <p class="text-white-50 fs-8 mb-0">
          <i class="bi bi-info-circle me-1"></i> Authorized administration personnel only. All access attempts are monitored and recorded.
        </p>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center text-white-50 small py-3 fs-7">
    &copy; 2026 Pexideal Systems. Internal Control Portal.
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Centralized Authentication Handler -->
  <script src="../js/auth.js"></script>

  <!-- Page UI Helpers -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const passwordInput = document.getElementById('login-password');
      const togglePasswordBtn = document.getElementById('btn-toggle-password');
      const toggleIcon = document.getElementById('toggle-icon');

      if (togglePasswordBtn && passwordInput && toggleIcon) {
        togglePasswordBtn.addEventListener('click', () => {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          toggleIcon.classList.toggle('bi-eye');
          toggleIcon.classList.toggle('bi-eye-slash');
        });
      }
    });
  </script>
</body>
</html>
