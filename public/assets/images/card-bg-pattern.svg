<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <!-- Background Pattern Lines -->
  <path d="M -50 100 C 100 200, 250 50, 550 200 L 550 350 L -50 350 Z" fill="url(#waveGrad)" />
  <path d="M -50 180 C 150 300, 300 100, 550 250 L 550 350 L -50 350 Z" fill="url(#waveGrad)" opacity="0.6" />
  <!-- Micro Grid Overlay -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="30" cy="30" r="2" /><circle cx="70" cy="30" r="2" /><circle cx="110" cy="30" r="2" />
    <circle cx="30" cy="70" r="2" /><circle cx="70" cy="70" r="2" /><circle cx="110" cy="70" r="2" />
    <circle cx="30" cy="110" r="2" /><circle cx="70" cy="110" r="2" /><circle cx="110" cy="110" r="2" />
  </g>
</svg>
